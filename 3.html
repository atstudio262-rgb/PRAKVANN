<!DOCTYPE html>
<html>
<head>
    <title>Adding image inside table cell</title>
    <style>
        body {
            text-align: center;
        }
        table {
            margin: 0 auto;
        }
        td {
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Adding image inside table cell</h2>

    <table border="1" cellpadding="5" cellspacing="2">
        <thead>
            <tr>
                <th>Course Name</th>
                <th>Description</th>
                <th>Image</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>DSA self placed course</td>
                <td>Learn with gfg</td>
                <td>
                    <img src="https://via.placeholder.com/100x60?text=DSA" alt="DSA Course" width="100" height="60">
                </td>
            </tr>
            <tr>
                <td>AI for beginners</td>
                <td>Learn Ai</td>
                <td>
                    <img src="https://via.placeholder.com/100x60?text=AI" alt="AI Course" width="100" height="60">
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
