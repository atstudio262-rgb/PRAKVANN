<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="index.php" method="POST" enctype="multipart/form-data">

        <label for="username">username:</label>
        <input type="text" id="username" placeholder="Spongebob" minlength="6" maxlength="15" required><br>
         
        <label for="password">password:</label>
        <input type="password" id="password" placeholder="Password" minlength="8" maxlength="20" required><br>
         
        <label for="email">email:</label>
        <input type="email" id="email" placeholder="SSauarepants@gmail.com" required><br>

        <label for="phone">phone #:</label>
        <input type="tel" id="phone" placeholder="123-231-1231" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4} "><br>

        <label for="birthdate">birthdate:</label>
        <input type="date" id="birthdate" ><br>

        <label for="quantity">quantity:</label>
        <input type="number" id="quantity" placeholder="1" min="0" max="99" value="1" required><br>

        <label for="title">title:</label>

         <label for="Mr.">Mr.:</label>
         <input type="radio" id="Mr." value="Mr." name="title">
         <label for="Ms.">Ms.:</label>
         <input type="radio" id="Ms." value="Ms." name="title">
         <label for="PhD.">PhD.:</label>
         <input type="radio" id="PhD." value="PhD." name="title"><br>

        <label for="payment">payment</label>
        <select name="payment" id="payment">
            <option value="credit">credit</option>
            <option value="debit">debit</option>
            <option value="paypal">paypal</option>
        </select><br>

        <label for="subscribe">subscribr:</label>
        <input type="checkbox" id="subcribe"><br>

        <label for="comments">comments:</label>
        <textarea name="comments" id="comments" cols="30" rows="10"c></textarea>
         
        <label for="file">file:</label>
        <input type="file" id="file" accept=".jpg,.jpeg,.png"><br>

        <input type="reset"><br>
        <input type="submit">
        
    </form>
</body>
</html>
