
<!DOCTYPE html>
<html>
<head>
    <title>HTML Table with Colors</title>
</head>
<body>

<table border="1" cellpadding="15" cellspacing="0" align="center" bgcolor="white">

    <!-- Top header row -->
    <tr bgcolor="lightblue">
        <td></td>
        <td align="center"><b>&lt;td&gt;</b></td>
        <td align="center"><b>&lt;td&gt;</b></td>
        <td align="center"><b>&lt;td&gt;</b></td>
    </tr>

    <!-- Row 1 -->
    <tr bgcolor="lightyellow">
        <td align="center"><b>&lt;tr&gt;</b></td>
        <td align="center">Content</td>
        <td align="center">Content</td>
        <td align="center">Content</td>
    </tr>

    <!-- Row 2 -->
    <tr bgcolor="lightgreen">
        <td align="center"><b>&lt;tr&gt;</b></td>
        <td align="center">Content</td>
        <td align="center">Content</td>
        <td align="center">Content</td>
    </tr>

    <!-- Row 3 -->
    <tr bgcolor="lightcoral">
        <td align="center"><b>&lt;tr&gt;</b></td>
        <td align="center">Content</td>
        <td align="center">Content</td>
        <td align="center">Content</td>
    </tr>

</table>

</body>
</html>
